<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  
  <!-- Mini Spreadsheet Sheet Grid -->
  <rect x="14" y="14" width="36" height="36" rx="6" fill="url(#sheetGrad)"/>
  
  <!-- Grid Header Bar -->
  <path d="M14 20 A6 6 0 0 1 20 14 L44 14 A6 6 0 0 1 50 20 L50 24 L14 24 Z" fill="#2563eb"/>
  
  <!-- Grid Lines -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="14" y1="40" x2="50" y2="40" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="28" y1="24" x2="28" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="40" y1="24" x2="40" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Excel X Badge -->
  <rect x="8" y="22" width="20" height="20" rx="5" fill="#15803d" filter="url(#shadow)"/>
  <rect x="8" y="22" width="20" height="20" rx="5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="18" y="37" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
  
  <!-- Sparkle AI Star in top-right -->
  <path d="M47 8 L48.5 12.5 L53 14 L48.5 15.5 L47 20 L45.5 15.5 L41 14 L45.5 12.5 Z" fill="#fbbf24"/>
</svg>
